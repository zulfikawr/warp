<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Warp - Local Network File Transfer" />
    <title>WARP UPLOAD</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="page">
      <!-- Header: Title + IP Address + Connection Status (mirrors TUI layout.go RenderHeader) -->
      <header class="header">
        <div class="ascii-box-top"></div>
        <div class="ascii-box-bottom"></div>
        <div class="ascii-box-left"></div>
        <div class="ascii-box-right"></div>
        <div class="box-corner box-corner-tl">+</div>
        <div class="box-corner box-corner-tr">+</div>
        <div class="box-corner box-corner-bl">+</div>
        <div class="box-corner box-corner-br">+</div>
        <div class="header-left">
          <span class="header-title">WARP UPLOAD</span>
        </div>
        <div class="header-right">
          <span class="header-ip" id="user-ip">Loading...</span>
          <span class="header-separator">|</span>
          <div class="header-status" id="connection-status">
            <span id="connection-text">Connecting</span>
            <span class="status-dot"></span>
          </div>
        </div>
      </header>

      <!-- Main Content Area -->
      <main class="main">
        <div class="ascii-box-left"></div>
        <div class="ascii-box-right"></div>
        <div class="content">
          <div class="content-box">
            <div class="ascii-box-top"></div>
            <div class="ascii-box-bottom"></div>
            <div class="ascii-box-left"></div>
            <div class="ascii-box-right"></div>
            <div class="box-corner box-corner-tl">+</div>
            <div class="box-corner box-corner-tr">+</div>
            <div class="box-corner box-corner-bl">+</div>
            <div class="box-corner box-corner-br">+</div>
            <!-- Upload Zone: Drag-and-drop area with ASCII art icon -->
            <div
              class="upload-zone"
              id="upload-zone"
              role="button"
              tabindex="0"
              aria-label="Drop files here or click to select"
            >
              <pre class="upload-icon" aria-hidden="true">
     .--------.
    /   ↑↑↑   /|
   +---------+ |
   |  FILES  | +
   |         |/
   +---------+
            </pre
              >
              <span class="upload-text"
                >Drop files here or click to select</span
              >
              <span class="upload-hint"
                >Supports multiple files • Drag &amp; drop enabled</span
              >
              <!-- Hidden file input triggered by upload zone -->
              <input
                type="file"
                id="file-input"
                class="sr-only"
                multiple
                aria-label="Select files to upload"
              />
            </div>

            <!-- File Queue: List of files staged for upload -->
            <div
              class="file-list"
              id="file-list"
              role="list"
              aria-label="Files queued for upload"
            >
              <!-- File items will be dynamically inserted here -->
            </div>

            <!-- Empty State: Shown when no files are selected -->
            <div class="empty-state" id="empty-state">
              <div class="empty-state-icon">[ ]</div>
              <div class="empty-state-text">No files selected</div>
            </div>

            <!-- Upload Button -->
            <button class="btn" id="upload-btn" disabled>
              [ START UPLOAD ]
            </button>
          </div>
        </div>
      </main>

      <!-- Footer: Keyboard shortcuts and status (mirrors TUI layout.go RenderFooter) -->
      <footer class="footer">
        <div class="ascii-box-top"></div>
        <div class="ascii-box-bottom"></div>
        <div class="ascii-box-left"></div>
        <div class="ascii-box-right"></div>
        <div class="box-corner box-corner-tl">+</div>
        <div class="box-corner box-corner-tr">+</div>
        <div class="box-corner box-corner-bl">+</div>
        <div class="box-corner box-corner-br">+</div>
        <div class="footer-shortcuts">
          <span class="footer-shortcut"><kbd>Space</kbd> Pause</span>
          <span class="footer-shortcut"><kbd>Esc</kbd> Cancel</span>
          <span class="footer-shortcut"><kbd>?</kbd> Help</span>
        </div>
        <div class="footer-status">
          <span id="status-text">Ready</span>
          <span class="status-indicator connected" id="status-indicator"></span>
        </div>
      </footer>
    </div>

    <!-- File Item Template (used by JavaScript to render queue items) -->
    <template id="file-item-template">
      <div
        class="file-item"
        role="listitem"
        data-file-id=""
        data-status="queued"
      >
        <div class="file-header">
          <span class="file-name" title=""></span>
          <span class="file-size text-dim"></span>
          <div class="file-actions">
            <button
              class="btn-icon btn-pause"
              title="Pause upload"
              aria-label="Pause upload"
            >
              ||
            </button>
            <button
              class="btn-icon btn-resume hidden"
              title="Resume upload"
              aria-label="Resume upload"
            >
              ▶
            </button>
            <button
              class="btn-icon btn-remove btn-danger"
              title="Remove file"
              aria-label="Remove file"
            >
              ×
            </button>
          </div>
        </div>
        <div
          class="progress-container"
          role="progressbar"
          aria-valuenow="0"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div class="progress-bar" style="width: 0%"></div>
        </div>
        <div class="file-status">
          <span class="file-speed text-primary"></span>
          <span class="file-progress-text text-success">0%</span>
        </div>
      </div>
    </template>

    <!-- Completed File Item Template (shows checkmark for completed uploads) -->
    <template id="file-complete-template">
      <div
        class="file-item"
        role="listitem"
        data-file-id=""
        data-status="complete"
      >
        <div class="file-header">
          <span class="file-name" title=""></span>
          <span class="file-size text-dim"></span>
          <div class="file-actions">
            <span class="text-success" aria-label="Upload complete">✓</span>
          </div>
        </div>
        <div
          class="progress-container"
          role="progressbar"
          aria-valuenow="100"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div class="progress-bar" style="width: 100%"></div>
        </div>
        <div class="file-status">
          <span class="file-speed text-dim">Complete</span>
          <span class="file-progress-text text-success">100%</span>
        </div>
      </div>
    </template>

    <!-- Error File Item Template (shows error state) -->
    <template id="file-error-template">
      <div
        class="file-item"
        role="listitem"
        data-file-id=""
        data-status="error"
      >
        <div class="file-header">
          <span class="file-name" title=""></span>
          <span class="file-size text-dim"></span>
          <div class="file-actions">
            <button
              class="btn-icon btn-retry"
              title="Retry upload"
              aria-label="Retry upload"
            >
              ↻
            </button>
            <button
              class="btn-icon btn-remove btn-danger"
              title="Remove file"
              aria-label="Remove file"
            >
              ×
            </button>
          </div>
        </div>
        <div class="progress-container">
          <div class="progress-bar error"></div>
        </div>
        <div class="file-status">
          <span class="file-error text-error"></span>
          <span class="file-progress-text error">Error</span>
        </div>
      </div>
    </template>

    <!-- Notification Template -->
    <template id="notification-template">
      <div class="notification" role="alert">
        <span class="notification-text"></span>
      </div>
    </template>

    <script src="/static/app.js"></script>
  </body>
</html>
